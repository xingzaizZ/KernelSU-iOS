name: Validate Swift

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  swift-lint:
    name: 语法与结构校验
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: 校验 Package.swift 可解析
        run: swift package dump-package > /dev/null && echo "Package.swift OK"

      - name: 编译 MicBoostCore（iOS SDK，仅算法层）
        run: |
          set -o pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          TRIPLE=$(xcrun --sdk iphoneos --show-sdk-platform-path > /dev/null 2>&1; echo "arm64-apple-ios16.0")
          swift build \
            --package-path . \
            --target MicBoostCore \
            --sdk "$SDK" \
            --triple "$TRIPLE" 2>&1 | tail -n 80

      - name: 运行单元测试
        run: |
          set -o pipefail
          swift test --package-path . 2>&1 | tail -n 100
